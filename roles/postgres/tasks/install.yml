---
- name: Install dependencies for PostgreSQL
  apt: name={{ item }} update_cache=true state=latest
  with_items:
    - bash
    - acl
    - openssl
    - libssl-dev
    - libssl-doc
    - gnupg
    - curl

- name: Ensure locales exist                                                                                                                                                                                                                                              
  locale_gen:                                                                                                                                                                                                                                                             
    name: 'en_US.UTF-8'                                                                                                                                                                                                                                                    
    state: present  

- name: Ensure keyrings directory exists
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download the PostgreSQL repository signing key
  get_url:
    url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
    dest: /etc/apt/keyrings/postgresql.asc
    mode: '0644'

- name: Add PostgreSQL repository
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/postgresql.asc] https://apt.postgresql.org/pub/repos/apt {{ ansible_distribution_release }}-pgdg main"
    filename: pgdg
    state: present
    update_cache: true

- name: "Install PostgreSQL"
  apt: name={{ item }} update_cache=yes state=present
  with_items:
    - postgresql-{{DHIS2_POSTGRES_VERSION}}
    - libpq-dev
    - python3-psycopg2
    - postgresql-{{DHIS2_POSTGRES_VERSION}}-postgis-3 